<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{{ titulo }}</title>
</head>
<body>
  <h1>{{ titulo }}</h1>
  <p>{{ descripcion }}</p>

  <h2>Funcionalidades principales</h2>
  <ul>
    {% for funcion in funciones %}
      <li>{{ funcion }}</li>
    {% endfor %}
  </ul>

  <p><strong>Equipo:</strong> {{ equipo }}</p>

  <hr>
  <p><small>Sitio de ejemplo del proyecto — Django.</small></p>
</body>
</html>
