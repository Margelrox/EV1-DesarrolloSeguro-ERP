{% extends 'inventario/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Guardar</button>
  <a class="btn btn-secondary" href="{% url 'inventario:product_list' %}">Cancelar</a>
</form>
<p class="mt-3">La ficha general no modifica precio ni stock. El precio se administra por separado.</p>
{% endblock %}
